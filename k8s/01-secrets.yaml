apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: financial-mcp
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres_dev_only
  POSTGRES_DB: financial_mcp
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-credentials
  namespace: financial-mcp
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_only
---
apiVersion: v1
kind: Secret
metadata:
  name: ui-session-secret
  namespace: financial-mcp
type: Opaque
stringData:
  UI_SESSION_SECRET: dev-only-session-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-db-credentials
  namespace: financial-mcp
type: Opaque
stringData:
  MCP_DB_DSN: "host=postgres.financial-mcp.svc.cluster.local port=5432 dbname=financial_mcp user=app_pool password=app_pool_dev_only"
