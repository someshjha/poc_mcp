kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: financial-mcp
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30432
        hostPort: 5432
        protocol: TCP
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30800
        hostPort: 8000
        protocol: TCP
      - containerPort: 30500
        hostPort: 5000
        protocol: TCP
