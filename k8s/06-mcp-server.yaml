apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: financial-mcp
spec:
  replicas: 1
  selector:
    matchLabels: { app: mcp-server }
  template:
    metadata:
      labels: { app: mcp-server }
    spec:
      containers:
        - name: mcp-server
          image: poc-mcp/mcp-server:local
          imagePullPolicy: Never
          envFrom:
            - secretRef: { name: mcp-db-credentials }
          env:
            # KEYCLOAK_ISSUER_URL stays the externally-reachable URL (not the
            # internal Service DNS below) because it must equal the `iss`
            # claim Keycloak stamps into tokens -- which, for the browser's
            # authorization-code login, is fixed at the front-channel /auth
            # request's Host header (http://localhost:8080, via kind's port
            # mapping), not by whichever URL later calls /token or fetches
            # JWKS. A token minted via a direct/password grant against the
            # *internal* URL would carry a different iss and be rejected --
            # not exercised by this system today (the UI only does the
            # browser flow), but worth remembering before adding one.
            - name: KEYCLOAK_ISSUER_URL
              value: "http://localhost:8080/realms/financial-mcp"
            - name: KEYCLOAK_JWKS_URL
              value: "http://keycloak.financial-mcp.svc.cluster.local:8080/realms/financial-mcp"
            - name: MCP_RESOURCE_SERVER_URL
              value: "http://localhost:8000"
            - name: MCP_ALLOWED_HOSTS
              value: "mcp-server.financial-mcp.svc.cluster.local:8000"
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: financial-mcp
spec:
  selector: { app: mcp-server }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-external
  namespace: financial-mcp
spec:
  type: NodePort
  selector: { app: mcp-server }
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
