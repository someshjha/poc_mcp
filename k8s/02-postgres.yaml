apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: financial-mcp
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: financial-mcp
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef: { name: postgres-credentials }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "financial_mcp"]
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "financial_mcp"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: financial-mcp
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-external
  namespace: financial-mcp
spec:
  type: NodePort
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
