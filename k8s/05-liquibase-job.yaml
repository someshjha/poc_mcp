# Mirrors docker-compose.yml's `liquibase` service invocation exactly:
#   entrypoint: ["liquibase"]
#   command: ["--defaultsFile=liquibase.properties", "update"]
#   working_dir: /liquibase/changelog
# db/liquibase.properties sets `changelog-file: changelog/changelog-master.xml`,
# and changelog-master.xml includes changelog/00X-*.sql with
# relativeToChangelogFile="false" -- both paths are resolved relative to the
# working directory. docker-compose achieves this by bind-mounting the whole
# ./db directory at /liquibase/changelog (so liquibase.properties sits at the
# mount root and a changelog/ subdirectory holds the XML + SQL files). A flat
# ConfigMap mount would collapse that structure, so this Job's volume uses
# `items:` to reconstruct the same subdirectory layout from the
# `liquibase-changelog` ConfigMap (generated by bootstrap.sh from
# db/liquibase.properties and db/changelog/*).
#
# The only difference from the docker-compose invocation is the DB connection
# target: liquibase.properties points at `postgres:5432` (docker-compose's
# service DNS name), which doesn't resolve in the cluster, so --url/--username
# /--password are passed as extra CLI args (these take precedence over the
# --defaultsFile values) pointing at the in-cluster Postgres Service instead.
apiVersion: batch/v1
kind: Job
metadata:
  name: liquibase-migrate
  namespace: financial-mcp
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: liquibase
          image: poc-mcp/liquibase:local
          imagePullPolicy: Never
          workingDir: /liquibase/changelog
          command: ["liquibase"]
          args:
            - "--defaultsFile=liquibase.properties"
            - "--url=jdbc:postgresql://postgres.financial-mcp.svc.cluster.local:5432/financial_mcp"
            - "--username=postgres"
            - "--password=postgres_dev_only"
            - "update"
          volumeMounts:
            - name: changelog
              mountPath: /liquibase/changelog
      volumes:
        - name: changelog
          configMap:
            name: liquibase-changelog
            items:
              - key: liquibase.properties
                path: liquibase.properties
              - key: changelog-master.xml
                path: changelog/changelog-master.xml
              - key: 001-schema.sql
                path: changelog/001-schema.sql
              - key: 002-roles-grants.sql
                path: changelog/002-roles-grants.sql
              - key: 003-rls.sql
                path: changelog/003-rls.sql
              - key: 004-seed.sql
                path: changelog/004-seed.sql
