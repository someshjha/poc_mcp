apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: financial-mcp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/someshjha/poc_mcp.git
    targetRevision: claude/db-schema-rls
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: financial-mcp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
