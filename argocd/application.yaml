apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: financial-mcp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/someshjha/poc_mcp.git
    # Points at this working branch for local-demo convenience -- change to
    # "main" once this work is merged, or Argo CD will keep deploying a
    # branch that no longer exists (or is stale) after merge/cleanup.
    targetRevision: claude/db-schema-rls
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: financial-mcp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
